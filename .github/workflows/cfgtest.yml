name: Config Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Clone source
        run: git clone --depth 1 -b openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-6.6 openwrt

      - name: Prepare defconfig
        run: |
          curl -fsSL "https://raw.githubusercontent.com/padavanonly/immortalwrt-mt798x-6.6/openwrt-24.10-6.6/defconfig/mt7981-ax3000.config" -o /tmp/def.config
          echo "defconfig 行数: $(wc -l < /tmp/def.config)"
          echo "defconfig 设备数: $(grep -c '^CONFIG_TARGET_DEVICE_.*=y' /tmp/def.config)"
          python3 "$GITHUB_WORKSPACE/scripts/cfgtest.py"

      - name: Run candidates
        run: |
          cd openwrt
          for n in A B C D; do
            echo "================ 候选 $n ================"
            cp /tmp/cfg_$n .config
            make defconfig > /tmp/def_$n.log 2>&1 || echo "!! make defconfig 非零退出"
            echo "--- 选中的设备 ---"
            grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | sed 's/^/    /' || true
            echo "--- 子架构 ---"
            grep -E '^CONFIG_TARGET_mediatek_(filogic|mt7981|mt7622|mt7623|mt7629)=y' .config | sed 's/^/    /' || true
            echo "--- MULTI_PROFILE / PER_DEVICE ---"
            grep -E '^CONFIG_TARGET_(MULTI_PROFILE|PER_DEVICE_ROOTFS)=y' .config | sed 's/^/    /' || true
          done

      - name: Summary
        run: |
          cd openwrt
          echo "================ 结论 ================"
          for n in A B C D; do
            cp /tmp/cfg_$n .config
            make defconfig > /dev/null 2>&1 || true
            if grep -q 'DEVICE_cmcc_rax3000m-emmc=y' .config; then
              echo "候选 $n: OK 能选中 rax3000m-emmc"
            else
              echo "候选 $n: FAIL 选不上"
            fi
          done
